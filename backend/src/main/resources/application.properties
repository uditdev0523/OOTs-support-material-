# ===================================================================
# Smart Manufacturing Order Processing System - Configuration
# ===================================================================

spring.application.name=smart-manufacturing-order-processing-system
server.port=${PORT:8081}

# Default DataSource Configuration (H2 in MySQL Compatibility Mode for zero-config local run & tests)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_manufacturing;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Console (Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Template Engine (cached for high throughput and ultra-low latency)
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# HTTP Compression & Latency Optimization (GZIP)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Static Resource Caching (browser cache for assets)
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.cache.period=86400

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Logging
logging.level.com.smart.manufacturing=INFO
logging.level.org.springframework.security=WARN
