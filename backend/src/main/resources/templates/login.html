<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; Smart Manufacturing Operations Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, #0f172a 0%, #1e293b 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: #ffffff;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
            position: relative;
        }
        .role-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .role-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
            transform: translateY(-1px);
        }
        .role-btn .role-avatar {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-2">
            <i class="bi bi-cpu-fill fs-2 text-info"></i>
        </div>
        <h4 class="fw-bold mb-1 tracking-tight">Smart Manufacturing Suite</h4>
        <div style="font-size: 0.82rem; letter-spacing: 0.08em; color: #bfdbfe; font-weight: 600;">ENTERPRISE ORDER &amp; PRODUCTION ROUTER</div>
        <p class="mt-2 text-white-50 small mb-0">High-throughput MRP scheduling &amp; real-time operations engine</p>
    </div>

    <div class="p-4 p-md-4">
        <!-- Error / Logout alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">Invalid credentials. Please verify your username and password.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}">Logged out successfully. Have a productive day!</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="e.g. admin">
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label fw-semibold text-secondary small mb-0">Password</label>
                    <button type="button" class="btn btn-link p-0 text-decoration-none small text-muted" onclick="togglePasswordVisibility()" style="font-size: 0.78rem;">
                        <i class="bi bi-eye" id="eyeIcon"></i> Show password
                    </button>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to System
            </button>
        </form>

        <!-- Quick 1-Click Role Profiles for Humanized Testing -->
        <div class="mt-4 pt-3 border-top">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small fw-bold text-uppercase" style="font-size: 0.72rem;">
                    <i class="bi bi-lightning-charge-fill text-warning me-1"></i> 1-Click Demo Profiles
                </span>
                <span class="badge bg-light text-success border"><span class="pulse-dot me-1"></span> Live</span>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <button type="button" class="role-btn" onclick="setDemo('admin', 'Mfg#Shield2026')">
                        <div class="role-avatar bg-primary text-white"><i class="bi bi-shield-fill"></i></div>
                        <div>
                            <div class="fw-bold">Admin</div>
                            <div class="text-muted" style="font-size: 0.68rem;">Rajesh Sharma</div>
                        </div>
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="role-btn" onclick="setDemo('manager', 'Mfg#Shield2026')">
                        <div class="role-avatar bg-info text-white"><i class="bi bi-gear-fill"></i></div>
                        <div>
                            <div class="fw-bold">Manager</div>
                            <div class="text-muted" style="font-size: 0.68rem;">Anita Deshmukh</div>
                        </div>
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="role-btn" onclick="setDemo('staff', 'Mfg#Shield2026')">
                        <div class="role-avatar bg-success text-white"><i class="bi bi-cart-check-fill"></i></div>
                        <div>
                            <div class="fw-bold">Order Staff</div>
                            <div class="text-muted" style="font-size: 0.68rem;">Vikram Malhotra</div>
                        </div>
                    </button>
                </div>
                <div class="col-6">
                    <button type="button" class="role-btn" onclick="setDemo('inventory', 'Mfg#Shield2026')">
                        <div class="role-avatar bg-warning text-dark"><i class="bi bi-boxes"></i></div>
                        <div>
                            <div class="fw-bold">Inventory</div>
                            <div class="text-muted" style="font-size: 0.68rem;">Suresh Pillai</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function setDemo(user, pass) {
        document.getElementById('username').value = user;
        const passInput = document.getElementById('password');
        passInput.value = pass;
        passInput.classList.add('is-valid');
        setTimeout(() => passInput.classList.remove('is-valid'), 1500);
    }

    function togglePasswordVisibility() {
        const pass = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pass.type === 'password') {
            pass.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            pass.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>

</body>
</html>
