<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Manufacturing Order Processing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
        }
        .login-header {
            background-color: #1e3a8a;
            color: #ffffff;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-cpu-fill fs-1 text-info mb-2 d-inline-block"></i>
        <h4 class="fw-bold mb-1">SMART MANUFACTURING</h4>
        <div style="font-size: 0.85rem; letter-spacing: 0.1em; color: #93c5fd;">ORDER PROCESSING SYSTEM</div>
        <div class="mt-2 text-white-50 small">Enterprise Resource &amp; Production Scheduling Platform</div>
    </div>

    <div class="p-4">
        <!-- Error / Logout alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter username">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold text-secondary small">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to System
            </button>
        </form>

        <!-- Quick-Fill Demo Users -->
        <div class="mt-4 pt-3 border-top">
            <div class="text-muted small fw-bold mb-2 text-uppercase" style="font-size: 0.72rem;">
                <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Demo Logins
            </div>
            <div class="d-flex flex-wrap gap-1">
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('admin', 'admin123')">
                    Admin
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('manager', 'manager123')">
                    Production Manager
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('staff', 'staff123')">
                    Order Staff
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('inventory', 'inventory123')">
                    Inventory Coord
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('supervisor', 'supervisor123')">
                    Supervisor
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function setDemo(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
    }
</script>

</body>
</html>
